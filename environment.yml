# Conda/mamba environment for the Utilities/ and Data_Processing/ Python layers.
#
# Create it with:
#   conda env create -f environment.yml
#   (or, much faster: mamba env create -f environment.yml)
#
# Then activate it:
#   conda activate trophic-maelstrom
#
# GPU acceleration (cupy) is deliberately NOT pinned here -- the correct cupy build depends on
# your installed CUDA toolkit version, and installing the wrong one breaks rather than degrades.
# Use setup_environment.sh alongside this file, which creates this env AND then detects your CUDA
# version and installs a matching cupy build; or install cupy yourself afterwards, e.g.:
#   pip install cupy-cuda12x      # for CUDA 12.x
#   pip install cupy-cuda11x      # for CUDA 11.x
# See https://docs.cupy.dev/en/stable/install.html if you're unsure which build you need.
# Everything in Utilities/ and Data_Processing/ degrades gracefully to NumPy/SciPy on CPU if cupy
# isn't installed or USE_GPU/--gpu isn't set -- it is optional, not required, for either layer.

name: trophic-maelstrom
channels:
  - conda-forge
dependencies:
  - python=3.11

  # ---- Core: required by both Utilities/ and Data_Processing/ -------------------------------
  - numpy
  - pandas
  - scipy
  - regex
  - matplotlib
  - scikit-learn                 # sklearn.cluster.KMeans, sklearn.mixture.GaussianMixture

  # ---- Core: required by Utilities/ (reorganise_dir.py, reorganise_prelims_dir.py, glow_up.py) --
  - scikit-image
  - esda                         # spatial statistics (bivariate Moran's I)
  - libpysal                     # spatial weights, used by esda
  - joblib                       # CPU parallel-post-processing fallback backend
  - dask                         # preferred parallel backend -- see Utilities/README.md's note on
  - distributed                  # why Dask is recommended over joblib for shared-GPU multi-threading
  - psutil                       # imported unconditionally by glow_up.py

  # ---- Core: required by Data_Processing/ (frame_builder.py) ---------------------------------
  - seaborn
  - opencv                       # cv2 -- builds/reads the per-species heatmap videos
  - powerlaw                     # power-law/decay fit overlays in several analyse_* functions
  - pip
  - pip:
      - adjustText               # label-placement helper for a few plots; conda-forge naming is
                                  # inconsistent across platforms, installing via pip avoids that

  # ---- Optional: only needed for dreamcatcher_automata.bash's remote-collation/compression steps --
  - p7zip                        # `7z` -- dreamcatcher_automata.bash's compression step
  - rsync                        # remote-device data collation
  - expect                       # drives the rsync calls in expect_commands.sh

  # ---- Optional: only needed for Data_Processing/frame_builder.py's H264 video re-encode step --
  - ffmpeg                       # shelled out to via subprocess; video generation itself still
                                  # works without it, you just keep the original (non-H264) .mp4

  # ---- Optional: only needed to run Data_Processing/frame_builder_walkthrough.ipynb ----------
  - jupyterlab
  - ipykernel
  - nbformat
  - nbconvert                    # only if you want to execute the notebook headlessly (as opposed
                                  # to interactively in Jupyter), e.g. `jupyter nbconvert --execute`

# NOT included here -- see the note at the top of this file: cupy (GPU acceleration) is
# CUDA-version-specific and installing the wrong build breaks rather than degrades, so it's left
# to setup_environment.sh (or a manual `pip install cupy-cudaXXx`) rather than pinned here.
